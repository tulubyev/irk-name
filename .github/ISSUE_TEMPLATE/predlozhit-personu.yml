name: Предложить персону
description: Предложите человека, связанного с Иркутском или Иркутской областью
title: "Предложение: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Мы публикуем только сведения, подтверждённые источниками. О наших современниках — только публичные, общеизвестные факты, без частной информации. Фото — только со свободной лицензией.
  - type: input
    id: name
    attributes:
      label: Имя и фамилия (отчество, если известно)
      placeholder: Иван Иванович Иванов
    validations:
      required: true
  - type: input
    id: years
    attributes:
      label: Годы жизни
      placeholder: "1900–1980, или: род. 1975"
  - type: dropdown
    id: sphere
    attributes:
      label: Вид деятельности
      multiple: true
      options:
        - Путешественники и первопроходцы
        - Купцы и меценаты
        - Писатели и поэты
        - Драматурги
        - Учёные
        - Военные и флотоводцы
        - Государственные деятели
        - Декабристы
        - Артисты и режиссёры
        - Спортсмены
        - Архитекторы и строители
        - Градоначальники
        - Революционеры и политики
        - Духовенство
        - Врачи
        - Музыканты
        - Интересные люди
        - Другое (укажите ниже)
    validations:
      required: true
  - type: input
    id: settlement
    attributes:
      label: Населённый пункт и район
      placeholder: "с. Оёк, Иркутский район"
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: Чем известен и как связан с местом
      description: Родился, жил, работал, был в ссылке… Коротко и по фактам.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Источники
      description: Ссылки на статьи, книги, музеи, архивы, энциклопедии. Без источников запись не публикуется.
    validations:
      required: true
  - type: input
    id: photo
    attributes:
      label: Фото (необязательно)
      description: Ссылка на фото со свободной лицензией (например, Wikimedia Commons), автор и лицензия.
  - type: checkboxes
    id: rules
    attributes:
      label: Подтверждение
      options:
        - label: Сведения публичные, я указал(а) источники и не публикую частную информацию.
          required: true
