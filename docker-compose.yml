# Запуск на сервере с готовым Traefik:  docker compose up -d --build
# Порты наружу не публикуются; сервисы подключены к внешней сети Traefik (traefik-public).
# HTTP→HTTPS редирект на сервере глобальный (entrypoint web), поэтому отдельных http-роутеров нет.
services:
  web:
    build:
      context: .
      args:
        PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-https://cdn.irk.name}
    image: irk-name-web:latest
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      # HTTPS: apex
      - traefik.http.routers.irkname.rule=Host(`${SITE_HOST:-irk.name}`)
      - traefik.http.routers.irkname.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname.tls=true
      - traefik.http.routers.irkname.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname.service=irkname
      - traefik.http.services.irkname.loadbalancer.server.port=80
      # HTTPS: www -> apex
      - traefik.http.routers.irkname-www.rule=Host(`www.${SITE_HOST:-irk.name}`)
      - traefik.http.routers.irkname-www.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname-www.tls=true
      - traefik.http.routers.irkname-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname-www.middlewares=irkname-www-redirect
      - traefik.http.routers.irkname-www.service=irkname
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.permanent=true


  # Админка /admin (включается: COMPOSE_PROFILES=admin в .env). Настройка — DEPLOY.md, раздел «Админка».
  admin:
    profiles: [admin]
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: irk-name-admin:latest
    restart: unless-stopped
    networks: [traefik]
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_ORIGIN: https://${SITE_HOST:-irk.name}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-tulubyev/irk-name}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      # Загрузка фото из админки. Без ключей кнопка загрузки отключена.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ru1.storage.beget.cloud}
      S3_REGION: ${S3_REGION:-ru1}
      S3_BUCKET: ${S3_BUCKET:-0a011f8d633a-irk-name}
      PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-https://cdn.irk.name}
    volumes:
      - suggestions:/data/suggestions
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      # приоритет выше, чем у основного сайта: /admin уходит в этот контейнер
      - traefik.http.routers.irkname-admin.rule=Host(`${SITE_HOST:-irk.name}`) && PathPrefix(`/admin`)
      - traefik.http.routers.irkname-admin.priority=100
      - traefik.http.routers.irkname-admin.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname-admin.tls=true
      - traefik.http.routers.irkname-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname-admin.service=irkname-admin
      - traefik.http.services.irkname-admin.loadbalancer.server.port=3000

  # Приём формы «Предложить персону» (/api/suggest). Работает всегда, секретов не требует.
  # Предложения пишутся только в том suggestions на этом сервере; читает их админка.
  forms:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: irk-name-admin:latest
    command: ["node", "forms.mjs"]
    restart: unless-stopped
    networks: [traefik]
    environment:
      PORT: 3001
      FORMS_ORIGIN: https://${SITE_HOST:-irk.name}
    volumes:
      - suggestions:/data/suggestions
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/suggest/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.routers.irkname-forms.rule=Host(`${SITE_HOST:-irk.name}`) && PathPrefix(`/api/suggest`)
      - traefik.http.routers.irkname-forms.priority=100
      - traefik.http.routers.irkname-forms.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname-forms.tls=true
      - traefik.http.routers.irkname-forms.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname-forms.service=irkname-forms
      - traefik.http.services.irkname-forms.loadbalancer.server.port=3001

volumes:
  suggestions:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true

