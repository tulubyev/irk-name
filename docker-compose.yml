# Запуск на сервере с готовым Traefik:  docker compose up -d --build
# Порты наружу не публикуются; сервисы подключены к внешней сети Traefik.
services:
  web:
    build:
      context: .
      args:
        PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-https://cdn.irk.name}
    image: irk-name-web:latest
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # HTTPS: apex
      - traefik.http.routers.irkname.rule=Host(`${SITE_HOST:-irk.name}`)
      - traefik.http.routers.irkname.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname.tls=true
      - traefik.http.routers.irkname.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname.service=irkname
      - traefik.http.services.irkname.loadbalancer.server.port=80
      # HTTPS: www -> apex
      - traefik.http.routers.irkname-www.rule=Host(`www.${SITE_HOST:-irk.name}`)
      - traefik.http.routers.irkname-www.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname-www.tls=true
      - traefik.http.routers.irkname-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname-www.middlewares=irkname-www-redirect
      - traefik.http.routers.irkname-www.service=irkname
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.irkname-www-redirect.redirectregex.permanent=true
      # HTTP -> HTTPS
      - traefik.http.routers.irkname-http.rule=Host(`${SITE_HOST:-irk.name}`) || Host(`www.${SITE_HOST:-irk.name}`)
      - traefik.http.routers.irkname-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.irkname-http.middlewares=irkname-https
      - traefik.http.routers.irkname-http.service=noop@internal
      - traefik.http.middlewares.irkname-https.redirectscheme.scheme=https
      - traefik.http.middlewares.irkname-https.redirectscheme.permanent=true

  cdn:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [traefik]
    environment:
      S3_HOST: ${S3_HOST:?задайте S3_HOST в .env}
      S3_BUCKET: ${S3_BUCKET:?задайте S3_BUCKET в .env}
    volumes:
      - ./deploy/cdn/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - cdn-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.irkname-cdn.rule=Host(`${CDN_HOST:-cdn.irk.name}`)
      - traefik.http.routers.irkname-cdn.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.irkname-cdn.tls=true
      - traefik.http.routers.irkname-cdn.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.irkname-cdn.service=irkname-cdn
      - traefik.http.services.irkname-cdn.loadbalancer.server.port=80
      - traefik.http.routers.irkname-cdn-http.rule=Host(`${CDN_HOST:-cdn.irk.name}`)
      - traefik.http.routers.irkname-cdn-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.irkname-cdn-http.middlewares=irkname-https
      - traefik.http.routers.irkname-cdn-http.service=noop@internal

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  cdn-cache:
